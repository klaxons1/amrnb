name: java-port

on:
  push:
  pull_request:

jobs:
  java-decoder:
    name: Java decoder vs JS decoder
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build Java port and compare output with JS decoder
        run: sh java/test.sh
